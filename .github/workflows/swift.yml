name: Swift validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests (offline fixtures)
        run: ./scripts/test.sh
      - name: Release build and Swift type checking
        run: swift build -c release
      - name: Diff whitespace
        run: git diff --check
